[package]
name = "simpul-creative-launcher"
version = "1.0.0"
edition = "2021"
description = "Simpul Creative Launcher: pasang, perbarui, dan buka aplikasi Simpul Creative Apps"
homepage = "https://simpulproject.com"
repository = "https://github.com/simpulcreativeapps/simpul-launcher"
rust-version = "1.85"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
simpul-guard = { git = "https://github.com/simpulcreativeapps/simpul-guard", rev = "85ad8d8" }
